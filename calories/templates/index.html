{% extends "base.html" %}
{% block title %}Home - Calorie Tracker{% endblock %}
{% block content %} 

<h2 class="text-3xl font-bold text-gray-800 mb-2">Today's Calories</h2>
<p class="text-gray-600 mb-8">Track your calories, Control your diet. Dont fatten up</p>

<div class="bg-white rounded-xl shadow-sm p-6 mb-8">
    <p class="text-gray-600 text-sm">Total Calories</p>
    <p class="text-4xl font-bold text-green-600 mt-2">0
        <span class="text-lg text-gray-500">kcal</span>
    </p>
    <div class="bg-white rounded-xl shadow-sm p-6 mb-8">

    <h3 class="text-xl font-bold text-gray-800 mb-4">
        Add Food
    </h3>

    <form>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Food Name
            </label>

            <input
                type="text"
                placeholder="e.g. Banana"
                class="w-full border border-gray-300 rounded-lg px-4 py-2"
            >
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Calories
            </label>

            <input
                type="number"
                placeholder="e.g. 105"
                class="w-full border border-gray-300 rounded-lg px-4 py-2"
            >
        </div>

        <button
            type="submit"
            class="bg-green-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-green-700"
        >
            Add Food
        </button>
    </form>

</div>

{% endblock %}
